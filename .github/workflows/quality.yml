name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: garage_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d garage_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres-ci-only@localhost:5432/garage_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: pytest --cov-report=xml
      - run: bandit -q -r src
      - run: pip-audit -r requirements.txt --progress-spinner off
      - run: docker build -t garage-api:${{ github.sha }} .

